<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Illustration of four stages: writer, technical reviewer, critic, rebuttal">
  <rect width="640" height="480" fill="#eaf0ee"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#14232b"/></marker></defs>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#14232b" text-anchor="middle">
    <rect x="40" y="70" width="230" height="90" rx="8" fill="#fff" stroke="#d3dcda"/><text x="155" y="122">Writer</text>
    <rect x="370" y="70" width="230" height="90" rx="8" fill="#fff" stroke="#d3dcda"/><text x="485" y="122">Technical reviewer</text>
    <rect x="370" y="270" width="230" height="90" rx="8" fill="#fff" stroke="#d3dcda"/><text x="485" y="322">Critic</text>
    <rect x="40" y="270" width="230" height="90" rx="8" fill="#fff" stroke="#d3dcda"/><text x="155" y="322">Rebuttal</text>
  </g>
  <g stroke="#14232b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M274 115 H366"/><path d="M485 164 V266"/><path d="M366 315 H274"/><path d="M155 266 V164"/>
  </g>
  <g fill="#2b6c8f"><rect x="62" y="92" width="90" height="8" rx="3" opacity=".35"/><rect x="62" y="106" width="60" height="8" rx="3" opacity=".35"/></g>
  <text x="320" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#536269">Weaknesses surface before the report goes out</text>
  <text x="40" y="458" font-family="system-ui, sans-serif" font-size="12" fill="#536269">Illustration.</text>
</svg>
